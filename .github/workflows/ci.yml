# Build, tests and clippy on every push and pull request; also generates an emulator with
# tools/new-emulator.sh and builds it, so the generator cannot rot.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets
      - name: libretro host against a real core (the toy core, through its libretro build)
        run: |
          cargo build -p toy-libretro
          LIBRETRO_TEST_CORE=$PWD/target/debug/libtoy_libretro.so cargo test -p libretro-host --test real_core -- --nocapture
      - name: Generator
        run: |
          tools/new-emulator.sh --libretro --ffi-c ci-sample "CI Sample" "Test - Sample"
          cargo build -p ci_sample -p ci-sample-libretro
